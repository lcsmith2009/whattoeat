<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b2c">
  <title>WhatToEat 2.0A PWA Test</title>
  <link rel="manifest" href="/app.webmanifest?v=2.0a-pwa-test-1">
  <link rel="icon" href="/icon-192.png">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#fff8ed;font:16px system-ui,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:520px}
    h1{margin:.25rem 0;font-size:2rem}p{line-height:1.5;color:#d8ccbf}button{font:inherit;font-weight:800;padding:14px 18px;border:0;border-radius:14px;background:#ff6b2c;color:white}
    #status{margin-top:18px;padding:12px;border:1px solid #ffffff22;border-radius:14px}
  </style>
</head>
<body>
<main>
  <p>WhatToEat Foundation Diagnostic</p>
  <h1>2.0A PWA install test</h1>
  <p>This page deliberately avoids the old WhatToEat install code. Tap once, leave this page open for at least 30 seconds, then check Chrome's menu.</p>
  <button id="tap" type="button">Tap to confirm engagement</button>
  <div id="status">Registering service worker…</div>
</main>
<script>
const status=document.getElementById('status');
document.getElementById('tap').addEventListener('click',()=>{status.textContent='Tap recorded. Wait 30 seconds, then open Chrome menu.';});
window.addEventListener('beforeinstallprompt',()=>{status.textContent='PASS: Chrome fired beforeinstallprompt. The preview is installable.';});
window.addEventListener('appinstalled',()=>{status.textContent='PASS: WhatToEat 2.0A Preview installed.';});
(async()=>{
  if(!('serviceWorker' in navigator)){status.textContent='FAIL: Service workers are unavailable in this browser.';return;}
  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    await navigator.serviceWorker.ready;
    status.textContent='Service worker ready. Tap the button, wait 30 seconds, then check Chrome menu.';
    reg.update().catch(()=>{});
  }catch(err){status.textContent='FAIL: Service worker registration failed: '+err.message;}
})();
</script>
</body>
</html>
