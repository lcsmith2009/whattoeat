<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b2c">
  <title>WhatToEat 2.0A PWA Diagnostic</title>
  <link rel="manifest" href="/app.webmanifest?v=2.0a-pwa-test-4">
  <style>
    body{margin:0;min-height:100vh;background:#0b0b0d;color:#fff8ed;font:16px system-ui,sans-serif;padding:24px;box-sizing:border-box}main{max-width:620px;margin:0 auto}h1{margin:.25rem 0 1rem;font-size:2rem}p{line-height:1.5;color:#d8ccbf}button{font:inherit;font-weight:800;padding:14px 18px;border:0;border-radius:14px;background:#ff6b2c;color:white}.panel{margin-top:18px;padding:14px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08}.row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px solid #ffffff12}.row:last-child{border-bottom:0}.label{color:#d8ccbf}.value{font-weight:800;text-align:right;word-break:break-word}.pass{color:#9cffb2}.fail{color:#ff9c9c}.wait{color:#ffd37a}
  </style>
</head>
<body><main>
  <p>WhatToEat Foundation Diagnostic</p><h1>2.0A PWA status</h1>
  <p>This page reports what Chrome can actually see on this device.</p>
  <button id="tap" type="button">Tap to confirm engagement</button>
  <div class="panel" id="summary">Running checks…</div><div class="panel" id="details"></div>
<script>
const summary=document.getElementById('summary'),details=document.getElementById('details'),tap=document.getElementById('tap');
let promptSeen=false,engagement=false;const r={};
const row=(l,v,s='')=>`<div class="row"><span class="label">${l}</span><span class="value ${s}">${v}</span></div>`;
function render(){
 const iconOK=r.icon192OK&&r.icon512OK;
 details.innerHTML=row('Secure context',String(r.secure),r.secure?'pass':'fail')+row('Standalone',String(r.standalone),r.standalone?'pass':'wait')+row('Manifest HTTP',r.manifestHttp??'checking…',r.manifestHttp===200?'pass':r.manifestHttp?'fail':'wait')+row('Manifest type',r.manifestType||'checking…',r.manifestType?.includes('manifest')?'pass':r.manifestType?'fail':'wait')+row('Manifest name',r.manifestName||'checking…',r.manifestName?'pass':'wait')+row('Icon A',r.icon192||'checking…',r.icon192OK?'pass':r.icon192?'fail':'wait')+row('Icon B',r.icon512||'checking…',r.icon512OK?'pass':r.icon512?'fail':'wait')+row('Service worker API',String(r.swApi),r.swApi?'pass':'fail')+row('SW registration',r.swRegistration||'checking…',r.swRegistration==='ready'?'pass':r.swRegistration==='failed'?'fail':'wait')+row('SW controller',String(r.swController),r.swController?'pass':'wait')+row('beforeinstallprompt',promptSeen?'FIRED':'not fired',promptSeen?'pass':'wait')+row('Engagement tap',engagement?'done':'not yet',engagement?'pass':'wait')+row('Origin',location.origin);
 if(!r.secure)summary.innerHTML='<strong class="fail">FAIL:</strong> Not a secure context.';
 else if(r.manifestHttp&&r.manifestHttp!==200)summary.innerHTML='<strong class="fail">FAIL:</strong> Manifest request failed.';
 else if(r.iconsChecked&&!iconOK)summary.innerHTML='<strong class="fail">FAIL:</strong> One or more manifest icons are invalid.';
 else if(r.swRegistration==='failed')summary.innerHTML='<strong class="fail">FAIL:</strong> Service worker registration failed.';
 else if(promptSeen)summary.innerHTML='<strong class="pass">PASS:</strong> Chrome fired the install prompt.';
 else if(r.swController&&r.manifestHttp===200&&iconOK)summary.innerHTML='<strong class="pass">CORE PWA PASS:</strong> Manifest, icons, and service worker are healthy. Chrome has not fired the install prompt yet.';
 else summary.textContent='Running checks…';
}
function loadIcon(src,declared){return new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({text:`${i.naturalWidth}×${i.naturalHeight} decoded / declared ${declared}`,ok:`${i.naturalWidth}x${i.naturalHeight}`===declared&&i.naturalWidth>=192&&i.naturalHeight>=192});i.onerror=()=>resolve({text:'load/decode failed',ok:false});i.src=src+'?diag='+Date.now();});}
tap.addEventListener('click',()=>{engagement=true;tap.textContent='Engagement confirmed ✓';tap.disabled=true;render();});
window.addEventListener('beforeinstallprompt',e=>{promptSeen=true;e.preventDefault();render();});
(async()=>{
 r.secure=isSecureContext;r.standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;r.swApi='serviceWorker'in navigator;r.swController=!!navigator.serviceWorker?.controller;render();
 try{const m=await fetch('/app.webmanifest?diag='+Date.now(),{cache:'no-store'});r.manifestHttp=m.status;r.manifestType=m.headers.get('content-type')||'(none)';if(m.ok){const j=await m.json();r.manifestName=j.name||'(missing)';const a=j.icons?.[0],b=j.icons?.[1];const ia=await loadIcon(a.src,a.sizes),ib=await loadIcon(b.src,b.sizes);r.icon192=ia.text;r.icon192OK=ia.ok;r.icon512=ib.text;r.icon512OK=ib.ok;r.iconsChecked=true;}}catch(e){r.manifestHttp='network error';}render();
 if(!r.swApi){r.swRegistration='failed';render();return;}try{const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});await navigator.serviceWorker.ready;r.swRegistration='ready';r.swController=!!navigator.serviceWorker.controller;reg.update().catch(()=>{});}catch(e){r.swRegistration='failed';}render();
 navigator.serviceWorker.addEventListener('controllerchange',()=>{r.swController=!!navigator.serviceWorker.controller;render();});
})();
</script></main></body></html>
